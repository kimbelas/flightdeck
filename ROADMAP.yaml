  - id: P9
    name: One press
    status: done
    goal: >-
      An agent, a skill or a ticket starts in the right project with one press and nothing typed
      but the ticket id.
    gate: >-
      From the deck: pick a project, pick a ticket from its own spec folder, pick an agent from
      its own roster, press once — a named background session starts in that folder under that
      agent with the plan-first prompt, on the subscription with more headroom, and the argv it
      ran with is in the audit row.
    depends_on: [P4]
    notes: >-
      **Most of this is built, and these notes say what is not.** Since P4 a preset is a profile
      function, a folder, a name and a prompt (D44); every imported project has four computed
      presets; the `ticket` preset computes the plan-first prompt from the id (`TicketPrompt`);
      preset groups launch in one press (P6-T4); routing picks the account with headroom (P4-T3);
      the workflow map (P3-T3) lists a project's agents, commands and skills with their trigger
      text. What is missing is the last inch: the map is not pressable, a preset cannot name an
      agent, the ticket id is typed rather than picked, and single presets are not in the palette.

      **Two facts from the docs this phase leans on** (checked 2026-09-25 against
      code.claude.com/docs/en/agent-view). `claude --bg "/skill-name args"` sends the skill as the
      first prompt and it runs — skills and prompt-expanding built-ins do; other built-ins print
      "attach to a session to run it" — so a preset whose prompt is a slash line is already a
      one-press skill. And `claude --agent <name> --bg "<prompt>"` is a documented example, so an
      agent is a flag the launcher may pass (SEC-PROC-2 lists `--agent` already).

      **What the owner has to hand, measured 2026-09-25.** Three projects imported (claude-kit,
      xpert-new, pdf-editor), zero saved presets, no user-level agents in either config dir, and
      plugins `superpowers` (fifteen skills), `context-hygiene`, `shell-review`,
      `frontend-design`, `typescript-lsp`, `chrome-devtools-mcp` — the skills the owner means are
      mostly plugin skills, which is why T5 exists. The first press is preceded by importing the
      folders the owner actually works in: a usage step the gate assumes, not a task.

      Sequenced before P7-T2..T5 by the owner (P7's notes, D59).
    tasks:
      - id: P9-T1
        title: An agent on a preset — allowlisted from the project's roster, passed as `--agent`, refused on the function that pins one
        status: done
        done_on: 2026-09-25
