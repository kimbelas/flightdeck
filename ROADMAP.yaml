          a clean shutdown and has since P5a-T1 — but `flightdeck-stop.cmd` is `taskkill /F`, which
          runs no handler, so the normal way this project stops left the token behind and taxed
          every render on the machine 51 ms instead of 0.10 ms. No in-process fix covers a forced
          kill, so the stop script now drops it (`scripts/drop-token.ts`, reading the path from
          contracts/core-token.ts). A crash still leaves one; F.3.3's circuit breaker stays on the
          table and is not built.
