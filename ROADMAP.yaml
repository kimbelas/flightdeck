          `{ maps, drifts }` — two lists rather than a field on each map, because they are two kinds
          of fact: a map is what is configured NOW and is re-derived from the disk every five
          minutes, a drift is what HAPPENED, at an instant, and lives in core's store.
          **It is the one reading in the project slice that writes, and D55 argues against D37 to
          get there.** D37 keeps stack and git out of the store because they are readings of now. A
