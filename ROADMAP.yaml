        notes: >-
          RESEARCH.md F.3. Measured on a running core: **2.2–3.9 ms** per ack, and seven posts of
          the two real captures produced **three** events — which is the whole design.
          **A render is not news.** The block posts on every repaint, so `VitalsRegistry` holds the
          last report and the queue publishes only when context, cost, model, name or either quota
          percentage moved — the reconciler's `sameRow` idea, for the same reason. Without it the
          log and, from P1-T8, the store would fill with hundreds of identical lines a minute per
          session.
