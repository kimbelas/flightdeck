    tasks:
      - id: P2-T1
        title: Next.js app at repo root — CSP and security headers, same-origin rewrite to core, no external requests
        status: done
        done_on: 2026-09-14
        notes: >-
          RESEARCH.md F.4.2. The same-origin rewrite is not a convenience — it is the only route
          that works. A page on :4949 cannot fetch :4950 directly, because a port is part of an
          origin: JSON triggers a preflight core never answers, and a simple request arrives as
          Sec-Fetch-Site same-site and is refused. Measured, not assumed. The upside is that the
          token never enters the browser for HTTP; only the WebSocket needs one, and only in its
          first frame (F.4.4).
          The app and the views landed ahead of this task — the scaffold under P0-T6, which needed
          a real Next runtime to measure xterm in, and the deck's own views under P1-T9 and P5a —
          so what this task actually did was prove the posture rather than write it. Three findings.
          (1) The CSP lives in proxy.ts, NOT middleware.ts, and these notes said middleware for four
          days: Next 16 deprecated the convention, and only proxy runs on Node, which is the whole
          reason it can read the token file (F.6.2, D27). Corrected here, in P0-T6's deliverables,
          in next.config.ts, CODING-STANDARDS §5 and the eslint config.
          (2) A test cannot import next.config.ts or proxy.ts. Doing so pulls Next's global type
          augmentation into the ROOT TypeScript project and breaks tsc for core/ and scripts/ — the
          exact leak tsconfig.app.json exists to stop, and it fails as ten unrelated errors about
          ProcessEnv. So every decision those two files encoded moved into contracts/, which is the
          only folder both projects compile: the headers and both matchers to deck-routes.ts, the
          per-request nonce to content-security-policy.ts, and the bearer — including the delete
          that fails closed when core is down — to core-token.ts. The Next files keep the wiring.
          (2b) And then the build broke on the one value that cannot move. Next PARSES
          `export const config` out of proxy.ts rather than evaluating it, so an imported matcher is
          not a string to it — `next build` fails with "Missing `source` in `matcher[0]` object".
          next.config.ts is genuinely executed and is unaffected. So the matcher is a literal, and
          tests/app/proxy-matcher.test.ts reads proxy.ts as TEXT to hold it to PROXIED_ROUTES.
          `npm run check` was green against a build that could not complete — the sixth time §G has
          been learned here, and the first where the evidence was a build rather than a page.
          (3) SEC-NET-2 had a hole on the one route that matters: ci.yml and release.yml set
          NEXT_TELEMETRY_DISABLED, flightdeck.cmd did not, so every local build POSTed to
          telemetry.nextjs.org. Set in the launcher rather than by `next telemetry disable`, which
          writes a per-user global that a fresh checkout would not carry.
