          quota unattended.** Most of this task is that second sentence.
          **A group is DERIVED, not stored.** `LaunchPreset.group` has been a field and
          `presets.preset_group` a column since P4-T1; a group is every preset wearing that name.
          Nothing creates one, nothing deletes one, and the last preset losing the name is the
          group ceasing to exist. It SPANS projects, because "morning" means the owner's morning
          rather than one repository's, and it is matched case-insensitively — two buttons a
          capital apart is a bug the owner would file against themselves.
          **This is the most expensive button in Flightdeck**, so three decisions are all about
          that. It refuses the WHOLE press rather than launching part of it: a group over
          `MAX_GROUP_LAUNCH` (6) starts nothing, not its first six, because a press that half-fired
          leaves the owner working out which half with quota already gone. A second press while one
          is in flight is `busy`, not a second intention — a palette entry is one Enter away from a
          second Enter (D48's call, for D48's reason). And the body carries a NAME and nothing else:
          a folder in the body would be a way to start a session outside every imported project,
          which is SEC-FS-1 reached through a door nobody was watching.
