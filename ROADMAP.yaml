          SPEC §5.5 "**completed** → Windows toast (per-session mute)" and §6.3, and D16 picked the
          library in 2026-09-10 from a survey nobody had run. G.51 ran it first, and four numbers
          shaped the code: `notify()` returns in **3 ms**, the callback fires when the toast is
          DISMISSED (3 786 ms for one that timed out), the spawned child does not hold the event
          loop, and the package is clean at `npm audit --audit-level=high` with verified
          signatures. The first two are why `Notifier.notify` is `void` — there is nothing to await
          except the owner's attention span.
          **Every rule is an EDGE, never a state** (D58), because a sweep re-observes the same
          blocked session every ten seconds. Two traps were written down before they could happen:
          a FIRST observation never toasts, or a core restarted beside three blocked sessions opens
