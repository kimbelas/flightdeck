          both config dirs across ten sessions — B.2's ~763 ms per dir, almost exactly, which is
          what the 10 s interval is sized against. A second sweep published NOTHING, so `sameRow`
          does not manufacture `changed` events out of re-reads. The process exited on its own
          after `stop()`, which is the test that no timer leaked: NodeScheduler deliberately does
          not unref, so shutdown cancels or core never exits on Ctrl+C.
          New ports: Scheduler and DirectoryWatcher (with Cancellation), both with fakes — timing
          tests run on a fake clock, not on a ten-second wait. `toSessionRow` was promoted out of
          DeckQuery so the deck and the reconciler cannot hold two opinions about `attachable`.
