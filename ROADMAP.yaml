      - id: P1-T9
        title: SSE /stream with state replay on connect
        status: done
        done_on: 2026-09-11
        depends_on: [P1-T4, P0-T8]
        notes: >-
          DECISIONS.md D27 chose the transport before this task existed, so what was left was the
          fan-out, the replay and the deck. The stream rides the deck's `force-dynamic` route
          handler at `/api/stream`, deliberately outside the `/api/core/*` rewrite.
          **Core keeps logging AND streams.** `FanOutEventSink` wraps `LoggingEventSink` and the new
          `EventHub`, so the reconciler still holds one `EventSink` and cannot tell how many things
          are behind it. Replacing the log with the stream would have traded the only record that
          survives the tab being closed for the one that does not.
          **The replay is free and is the whole design.** `Reconciler.snapshot()` reads the map the
          sweeps already fill, so a browser connecting costs no `claude.exe` call and cannot
          disagree with the deltas that follow; `DeckQuery` still sweeps, which is right for
          `GET /sessions` and wrong for a connect at 1.5 s per subscriber. One frame rather than a
          burst of upserts because `unreadable` belongs to the sweep, not to any row.
          **Only `reconcile` events are forwarded, and that is a boundary rather than an omission.**
          `DraftEvent.payload` is `unknown` because it is the producer's raw material, and the hook
          payloads P1-T5 will publish carry model text (`Stop` carries last_assistant_message,
          SEC-UI-2). Nothing reaches a browser that core did not derive into a `SessionRow`, and the
          row is re-parsed on the way out (`parseSessionRow`) rather than trusted.
          Two things this task found by running it, both in RESEARCH.md §G. (1) **G.7:
          `next.config`'s header block REPLACES a route handler's own**, and had silently taken
          `Cache-Control: no-transform` off the stream — the one lever that stops Next gzipping an
          event stream into a single chunk, and the entire reason D27 put the mitigation in the
          deck. Nothing was batching yet, which is what made it worth writing down. (2) **G.8: the
          deck is blank for ~1.2 s after core restarts**, because the first snapshot from a core
          that has bound its port but not finished a sweep is honestly empty. Left alone.
          A third finding, from probing rather than from the page (RESEARCH.md G.9): `stream.closeAll()`
          must come BEFORE `server.close()` and the order is not interchangeable. `close()` reaps idle
          connections once, on the way in, and stops the interval that would reap them later, so a
          stream closed afterwards leaves a keep-alive socket nothing collects and core never exits.
          Both halves are pinned by tests.
          Verified in a real browser against a real core: the page hydrates under the production
          CSP, opens the stream, renders from the replay, fetches `/api/core/sessions` on mount
          never again; and killing core mid-session gives `core down`, the last known rows, one
          reconnect attempt, and nine rows back 1171 ms later as deltas from the new core's first
          sweep — with no page reload.
          Known gap, named in the code and the README: `unreadable` moves only on a snapshot. A
          subscription that becomes unreadable publishes no event at all (reconciler trap 1) and
          `DraftEvent` has no shape for a subscription-level fact, since `sessionId` is required.
          Widening that is P1-T8's call, where the store decides what an event is. `refresh` is
          what moves the banner until then.
        deliverables:
