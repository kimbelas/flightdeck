        notes: >-
          Three feeds decide WHEN to look (D3); one decides what is true, and it is the sweep.
          `fs.watch` is a nudge that may fire in bursts, spuriously, or not at all — E.5's
          ReadDirectoryChangesW semantics are not a bug to work around but the contract the port
          writes down — so the watcher adapter pairs it with a 2 s stat poll of the same
          directories and both only ever make the next sweep early.
          **The task turned up a bug in P1-T3 before it wrote a line of its own.** The source ran
          `agents --json` WITHOUT `--all`, and F.2.2 had already measured that the plain listing
          omits stopped and retired sessions entirely — so the first reconciler to run would have
          announced `gone` for every `claude stop`. Fixed in the adapter, where fixtures/agents/
          retired.json was already captured from the `--all` invocation. Verified on this machine:
          of the ten sessions found, FIVE are not live and would have been invisible.
          Two more traps, each refused with a test. (1) A failed sweep runs NO gone-detection for
          that subscription — `claude.exe` unavailable for four seconds would otherwise report
          every session on it as ended. (2) `gone` takes TWO consecutive successful sweeps of the
          session's own subscription, because G.2 measured that a record carries `state: working`
          before it carries `pid`: one sweep is never evidence that a session ended, and nothing
          here latches.
