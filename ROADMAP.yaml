        deliverables: [fixtures/hooks/*.json, RESEARCH.md F.1, scripts/hook-spike.ts, scripts/capture-fixtures.mjs]
        security: [SEC-ING-1, SEC-ING-2]
      - id: P0-T4
        title: --bg end to end — running background session shape in agents --json, logs, attach inside node-pty, second-attach error, stop, resume, rm; time the idle retirement once
        status: done
        done_on: 2026-09-10
        notes: >-
          RESEARCH.md F.2. Spike sessions fd-spike-idle, -a, -b, -c, -d removed on completion;
          TICKET-1898, orchestrator, docs-tool-f7 and a41e908d were never touched (SEC-PROC-5).
          Headline findings —
          (1) a LIVE background record has nine keys including pid AND status, so B.2 described the
          retired shape, not the background shape; presence of pid is the liveness test.
          (2) waitingFor never appears; the attention signal is state === 'blocked'.
          (3) attach is LAST-one-wins — the documented "Can't open" refusal never fires, the earlier
          attach is evicted with exit 0, so exclusivity is entirely ours (SEC-WS-3).
          (4) --resume forks a copy unless it is `--resume <full-uuid>` with no other argument.
          (5) rm removes a live session with no confirmation.
          (6) daemon/roster.json holds rvAuth/ptyAuth and prompt text — see P1-T14.
          (7) idle retirement fires at 60 min since last ACTIVITY, but the log line prints the
          session's AGE — the two coincide only for a session nobody touched, and the reason word
          (settled / idle-prompt / empty-idle) is the state it retired in. Low memory cuts it
          to ~32 min, so nothing may assume a session survives an hour.
        deliverables:
