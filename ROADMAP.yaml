          **The launch finally honours D4.** P2-T2's launcher spawned `claude.exe` with
          `CLAUDE_CONFIG_DIR` set, which reproduces `claude-365` and `claude-isg` exactly and loses
          everything the other two functions do; a deck offering four presets and running two of
          them would have been P4-T0's `.bashrc` drift in a different file. It runs
          `powershell.exe -NoLogo -NonInteractive -EncodedCommand <script>` now, one fixed script
