            core/http/launch-route.ts,
            app/deck/presets-panel.tsx,
            app/deck/presets-view-model.ts,
            tests/core/application/agent-roster.test.ts,
            tests/core/application/session-launcher-agent.test.ts,
            tests/core/http/launch-route.test.ts,
            tests/contracts/launch-preset-agent.test.ts,
            tests/win/powershell-launch.test.ts,
            tests/e2e/smoke/agent-checks.mjs,
            SECURITY.md SEC-PROC-2,
          ]
        notes: >-
          **Done 2026-09-25. Verified against the real core and a real session.** On xpert-new, whose
          roster is german-ui-expert, niklas-reviewer and orchestrator, a preset saved with
          niklas-reviewer round-trips. A `claude-365` launch under it started `59118e15`, and Claude
