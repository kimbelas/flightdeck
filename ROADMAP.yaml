# Flightdeck roadmap — the one place we track what is done.
#
# Update `status` (and `done_on`) as work lands.
#   npm run roadmap         prints progress and what is next
#   npm run roadmap:check   validates this file (also runs in CI)
#
# status: todo | doing | done | blocked | dropped
# Task ids go in commit messages:   feat(core): reconciler skeleton [P1-T4]

version: 1
project: flightdeck
updated: 2026-09-26

docs:
  spec: SPEC.md
  research: RESEARCH.md
  decisions: DECISIONS.md
  build_plan: BUILD-PLAN.md
  standards: CODING-STANDARDS.md
  security: SECURITY.md

rules:
  - A phase starts only when the previous phase's gate sentence is true.
  - A task is done when its tests pass in CI and the PR checklist is ticked.
  - Every task id appears in at least one commit message.
  - Anything security-relevant links the SECURITY.md control it satisfies.

# DP1 and DP2 were answered on 2026-09-10 (DECISIONS.md D20, D21) and are gone from this list.
decisions_pending:
  - id: DP3
    question: >-
      Tauri shell — worth building for a tray badge and a global hotkey alone? The Ctrl+W argument
      that scheduled it in D1 does not apply; the owner does not use Ctrl+W to delete words.
    deferred_to: P5a
    why_deferred: Five minutes of typing into a real pane answers it; deciding now is guessing.
    blocks: [P5b-T1]
    ref: DECISIONS.md D22
  - id: DP4
    question: >-
      Tailscale on this machine and on the phone — acceptable? P8 reaches the deck through an
      identity-aware reverse proxy the owner installs in front of loopback, never through a wider
      bind (SEC-NET-1), and Tailscale is the recommendation: WireGuard between the owner's own
      devices, HTTPS from `tailscale serve`, no port opened on the router, no domain, a phone app,
      and a one-line inverse (`tailscale serve reset`). The alternatives are a Cloudflare Tunnel
      with Access (a third party in the path, needs a domain, reachable from the whole internet)
      or an SSH port-forward from the phone (works, but every open is a ritual, which is the
      failure the "automate, don't ask him to remember" rule names). Installing a mesh VPN client
      on both devices is the owner's call, as the Rust toolchain was (D22) and the logon task was
      (DP2, D21).
    deferred_to: P8-T2
    why_deferred: >-
      Two facts the spike measures decide the shape of P8-T3 (whether the proxy preserves Host,
      whether it carries the WebSocket upgrade); the install itself only the owner can approve.
    blocks: [P8-T2]
    ref: DECISIONS.md D59
  - id: DP5
    question: >-
      Does a ticket ever come from OUTSIDE the repository? P9-T3 reads ticket ids from the
      project's own `.claude/specs/` and `.claude/state/` because that is where the plan-first
      prompt already sends Claude. A Jira, Linear or GitHub Issues picker would be the first
      outbound call core makes (SEC-NET-2 forbids it today) and would carry a credential the
      machine does not hold yet. Not needed for P9's gate; asked here so it is not built by
      reflex.
    deferred_to: P9-T3
    why_deferred: >-
      The repo-local picker answers the goal as stated; the tracker question only exists if the
      owner finds the id is not in the repo when a session should start.
    ref: DECISIONS.md D59

milestones:
  - id: M1
    name: The deck answers "what needs me?" without a terminal
    after: P2
  - id: M2
    name: Sessions start from the deck, named, on the subscription with more headroom
    after: P4
  - id: M3
    name: A full working day with no hand-opened terminal
    after: P6
  - id: M4
    name: What needs me, and a prompt sent, from the phone — with the machine's bind addresses unchanged
    after: P8
  - id: M5
    name: A ticket starts under the chosen agent, in its project, with one press
    after: P9

