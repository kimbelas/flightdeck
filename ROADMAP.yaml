          socket close and process exit, and refuses the second with `held_elsewhere` WITHOUT
          spawning. The debt this task recorded — that the pane could not tell eviction from a
          normal exit, because the socket reports `exit 0` either way — was PAID by P5a-T6a:
          `PaneSocket.close` is the "did I ask?" flag, and a session PTY exiting 0 with nobody
          asking now reads as `evicted` rather than as ended. node-pty also
          prints `AttachConsole failed` on stderr from its conpty_console_list helper when core has
          no attached console; harmless, but it litters the logon task's log (D21) — silence or
          redirect it in P1-T12.
