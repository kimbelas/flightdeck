          real 506-line CRLF file — both anchors found, +74 lines in two marked regions, and
          `remove(apply(x)) === x` byte for byte — so the evidence that it still fits is in the PR.
          Writing it is Connect's (P1-T11), which is where the owner already moved the hook
          install and which owns the backup and dry-run procedure. Nothing posts to this route
          until then.
