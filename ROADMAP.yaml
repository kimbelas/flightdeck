      - id: P1-T11
        title: Connect — compute, dry-run diff, back up and atomically merge the hooks + statusLine blocks into $CFG/settings.json; Disconnect reverses it
        status: done
        done_on: 2026-09-12
        depends_on: [P1-T5, P1-T6]
        notes: >-
          **The token question is answered, and not the way the question expected** (RESEARCH.md
          F.1.7, DECISIONS.md D33). `allowedEnvVars` does supply the header — both `${VAR}` and
          `$VAR` interpolate, and an *undeclared* name resolves to the empty string rather than
          being left alone, so a typo is a 401 rather than anything readable. But the value comes
          from the SESSION PROCESS'S OWN ENVIRONMENT, which Windows fixes at process creation, so a
          per-boot token (SEC-HTTP-3) cannot reach a session that started before the current core.
          A stale bearer is a 401, and a 401 on a hook is `Stop hook error occurred` for every turn
          afterwards (F.1.5) — the banner this task exists to refuse, caused by us, while core is
          running. **A secret a client cannot re-read must not rotate under it**, so hooks got
          SEC-HTTP-7: a stable per-install ingest key, accepted on `POST /hooks` and nothing else.
          Verified live — ingest key to /hooks 200, to /statusline 401, to /health 401; wrong key
          401. `/statusline` stays token-only because the block re-reads the token file per render
          (SEC-ING-3), so per-boot costs it nothing.
          The global `httpHookAllowedEnvVars` is deliberately NOT written: when it is present Claude
          Code intersects every hook's list with it, so Connect would silently narrow http hooks the
          owner adds later.
          **F.1.1's probe is done — all eleven events, one run, two transports** (F.1.6). Every
          event got an `http` handler AND a `command` handler at once, because a handler that never
          fires is indistinguishable from a quiet machine and only the other transport tells them
          apart. `SessionStart` is still the only event `http` drops, unchanged on 2.1.269.
          `Notification` works, which matters most — it is the "needs you" signal. `PostCompact` was
          never reached (compaction was declined) and is the one honest gap.
          **Connect installs five events and skips five on purpose.** `SessionStart` is not
          installed even as a `command` handler: the reconciler already learns of a new session from
          the sweep and `fs.watch` (D3 feeds 3 and 5), so it would be a second mechanism to keep in
          agreement with the first, for news the first already has. `PreToolUse`/`PostToolUse` fire
          per tool call and nothing reads them yet — adding them later is one line, taking a
          per-tool-call POST back out of the owner's sessions is not.
          **Two bugs found by running it, both in RESEARCH.md §G.** G.13 — `JSON.stringify` always
          emits LF, and `.claude-isg`'s settings.json is CRLF while `.claude-365`'s is LF, so the
          same code produced +85/-0 on one subscription and a whole-file rewrite (+173/-88 on 88
          lines) on the other. Every unit test passed, because they compare parsed objects; only the
          whole-file dry run showed it. `core/shared/json-format.ts` now re-prints in the file's own
          convention. It is F.3.7's trap in a second file three days later, because the lesson had
          been recorded as a fact about statusline.py rather than about writing to files somebody
