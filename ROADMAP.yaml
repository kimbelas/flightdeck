        notes: >-
          The `claude logs` fixture is OWNED and DEFERRED is now empty (DECISIONS.md D28 paid off).
          The non-JSON scrub path is D42, and it was designed against this task's parser rather than
          guessed: what a terminal emulator needs preserved is not the SHAPE of a value, it is the
          LENGTH of one, because every glyph advances the cursor a cell and the frame relies on
          autowrap. So escape sequences pass byte for byte, every ASCII letter and digit is replaced
          IN PLACE preserving case and class, and the chrome glyphs stay. The filler is keyed on
          POSITION and LENGTH and never on the word — a per-word hash of a 4 000-word screen is a
          substitution cipher a dictionary undoes with one sha256 per guess, and the property that
          replaces it is testable: two frames differing only in their words scrub to identical
          bytes. A non-ASCII letter and a `.txt` with no escape sequence both FAIL the capture
          rather than being guessed at.
          **The 330 KB fixture is unreadable, so a 25-line golden is committed beside it** —
          `logs-blocked.screen.txt`, the screen it flattens to. It is not regenerated by
          capture-fixtures.mjs: a golden rewritten by the code it checks proves nothing.
          **Two things the SPEC said are now measured and changed (D43).** Who it is for: §5.3 gave
          previews to panes a WebGL budget had no renderer for and D40 deleted that budget, but the
          set this serves was never empty — an interactive session can NEVER be attached (§5.2), so
          a preview is the only way to see one. And the cadence: "refreshed every few seconds" was
          written before G.34 measured 2.7 s and 330 KB per read, so it is a BUTTON. Nothing on
          expand, nothing on a timer; the age is shown because a preview is a photograph.
          It lives in the expanded row rather than the pane grid, and that is a decision with a
          cost: a pane is a live PTY with a socket, a ticket, an exclusivity claim and a place in a
          layout that must not remount, and a preview is a JSON request with no lifecycle. Moving
          it into the grid later is a task, not a refactor.
          **The daemon is checked before it is used and the command is trusted over the check.** A
          `claude logs` against a dead daemon takes 1.7-2.5 s to FAIL (G.34) — almost as long as a
          working one — and reading roster.json's supervisorPid answers the same question in under
          a millisecond. In the running app that is 259 ms against 2 186 ms. The roster is a cache,
          so a `logs` that fails anyway still falls back: the pre-check is the optimisation, the
          fallback is the correctness. Both rosters on this machine named DEAD supervisors when this
          was written, one for nine days — F.2.16 is the normal state, not the edge case.
          The trail shows only records the transcript parser already reads — no conversation text,
          because that would widen `contracts/transcript-record.ts` to `assistant` message content
          for a fallback view (SEC-DATA-1).
          **Four things were found by running it, not by testing it**, which is §G's lesson
          arriving four times in one task. G.35: `.gitattributes`' `eol=lf` would have rewritten the
          frame's 4 723 CRLFs and stepped the screen right on every line — invisible on the machine
          that wrote it, fatal on a fresh clone. G.36: `terminal.buffer` is proposed API, the
          adapter's catch turned its refusal into fifty blank rows, and a blank preview is
          indistinguishable from a quiet session — the reader now takes a Logger and says why.
          G.37: the trail came back saying about six things in twenty-four rows, because Claude Code
          REWRITES `last-prompt` every turn rather than appending. G.38: splitting a CSS rule took
          `flex` and `min-height` with it and 180 smoke checks passed anyway.
          **Two sabotages did not land the first time** and their green runs were meaningless until
          the edit was verified — Prettier had rewrapped both targets. That is G.32 from the other
          direction and it is in G.38.
        security: [SEC-UI-2, SEC-FS-2, SEC-PROC-1]
      - id: P5a-T5
        title: Layouts 1/2/4/6/9 + focus mode, remembered across a reload, keyboard rearrange
        status: done
        done_on: 2026-09-20
        depends_on: [P5a-T3]
        deliverables:
          [
            contracts/pane-layout.ts,
            contracts/keymap.ts,
            app/deck/use-pane-grid.ts,
            app/deck/deck-body.tsx,
            app/deck/deck-view.tsx,
            app/deck/pane-grid.tsx,
            app/deck/pane-view.tsx,
            app/deck/deck-commands.ts,
            app/deck/deck-keyboard.ts,
            app/deck/use-deck-keys.ts,
            app/globals.css,
            tests/contracts/pane-layout.test.ts,
            tests/e2e/smoke/pane-checks.mjs,
          ]
        notes: >-
          SPEC §5.3's first bullet. A layout is CHOSEN now rather than derived from how many panes
          are open — `deck-commands.ts` had been carrying "there is nothing to choose until there is
          a chooser" since P2-T5, and this is the chooser, in the pane bar and as six palette
          entries running the same call. The pane cap moves from 4 to 9, which is the phase gate's
          number. The count still decides the DEFAULT, and only until somebody picks; after that the
          choice stands even when it is smaller than the panes open, and the extras scroll. A choice
          that quietly un-chose itself on the next pane would be worse than no chooser.
          `[` and `]` move the focused pane, `deck`-context only. That is D34 rather than a
          compromise: `Ctrl+K` is the ONE key taken from a live pane, so every bracket typed at a
          shell still reaches the shell, and rearranging is something you do from the deck.
          **The load-bearing constraint is that a layout change must not remount a pane.** React
          keeps a component mounted only while it stays in the same position in the tree, so the
          obvious shape for focus mode — a "stage" wrapper around the big pane and a "strip" around
          the rest — would unmount and rebuild every card on every layout change, and unmounting a
          pane disposes its terminal and closes its socket. For an attached session that is killing
          a live PTY because somebody clicked a layout button. So every card is a direct child of
          one container in array order in every layout, and focus mode is grid placement: eight
          explicit columns so the focused card can span `1 / -1`, and an `auto` strip row so one
          pane open leaves no empty band under it.
          Two things this task had to fix about its own checks, which is G.29's lesson arriving one
          task later and cheap. The layout assertions measure GEOMETRY — two cards side by side
          share a `y` and differ in `x` — rather than reading a class name off the container, so the
          stylesheet is under test; deleting the `.panes-2` rule fails them. And the first remount
          detector was `data-pane-attempt`, which is component state that a remount RESETS, so it
          compared `["0","0"]` with `["0","0"]` and passed against a build that rebuilt both
          terminals on every move. `data-pane-mount` is a counter kept outside React, and with
          `key={index}` in place of `key={pane.key}` the check fails `["1","2"] -> ["3","4"]`.
          "Saved per project" is the one word of the title not shipped, and it is deferred rather
          than dropped: the layout is remembered per BROWSER in `localStorage`, because this deck
          has no current project to key it by until P3-T6 builds the by-project view — which is also
          where the palette's "switch project" is waiting. A key invented here would be one P3-T6
          had to migrate off. Reading it happens in an effect, not in a `useState` initialiser:
          `localStorage` does not exist while Next renders on the server, and the first client
          render would disagree with it.
