  - id: P5a
    name: Terminal grid
    status: doing
    goal: Terminals stop being opened on the desktop.
    gate: Nine sessions in one window; typing in the focused pane is indistinguishable from a terminal; closing a pane never stops a session; reopening the deck re-attaches.
    depends_on: [P4]
    tasks:
      - id: P5a-T1
        title: PTY host — node-pty attach panes, exclusivity registry, detach on close
        status: done
        done_on: 2026-09-11
        notes: >-
          RESEARCH.md F.2.6. attach is last-one-wins: the CLI never refuses a second attach, it
          evicts the first, which exits 0. So the exclusivity registry is the only thing enforcing
          it, and a pane must read "my PTY exited 0 and I did not ask" as evicted, not as ended.
          Killing an attach does not stop the session (the phase gate holds). node-pty keeps the
          event loop alive after kill() — the host owns disposal explicitly.
          DONE under D30: PaneRegistry holds one pane per subscription+sessionId, releases on both
          socket close and process exit, and refuses the second with `held_elsewhere` WITHOUT
          spawning. STILL OWED, and deliberately not claimed here: the pane has no way yet to tell
          eviction from a normal exit — the socket reports `exit 0` either way, and distinguishing
          them needs the "did I ask?" flag the deck does not have until P5a-T6. node-pty also
          prints `AttachConsole failed` on stderr from its conpty_console_list helper when core has
          no attached console; harmless, but it litters the logon task's log (D21) — silence or
          redirect it in P1-T12.
        security: [SEC-WS-2, SEC-WS-3]
      - id: P5a-T2
        title: WS /pty — Origin check, token in first frame, session binding, max payload, idle timeout
        status: done
        done_on: 2026-09-11
        security: [SEC-WS-1, SEC-WS-2, SEC-WS-3]
      - id: P5a-T2b
        title: WS ticket — core mints a short-lived single-use ticket so the per-boot token never enters the page
        status: done
        done_on: 2026-09-11
        depends_on: [P5a-T2]
        notes: >-
          DECISIONS.md D32, which supersedes D31. `POST /pty-ticket` mints a 256-bit ticket bound
          to one PtyTarget, good for 10 s and burnt on presentation; the socket redeems it against
          the target parsed from its own upgrade URL, so a ticket cannot open a pane it was not
          minted for. The deck reaches the mint through the same-origin rewrite, which attaches the
          bearer server-side — `app/api/pty-token/route.ts` is deleted and the token no longer
          enters the browser at all. `LoopbackGuard.screenFirstFrame` is deleted with it rather
          than left unused: a guard that still accepted the token there would re-open the hole.
          It was nearer 120 lines than forty, mostly tests.
        security: [SEC-HTTP-3, SEC-WS-1, SEC-UI-1]
      - id: P5a-T3
        title: Pane component — xterm.js 6, renderer budget (WebGL only where focused), DOM fallback on context loss
        status: done
        done_on: 2026-09-11
        depends_on: [P0-T6]
        notes: >-
          RESEARCH.md F.5.2-F.5.3. The binding constraint is NOT the context count — measured at 40
          headless and 76 on the real GPU here, against a 9-pane layout — it is that
          @xterm/addon-webgl fires onContextLoss from a hard-coded setTimeout(..., 3000), so an
          evicted pane stays dead for ~3 s before the DOM renderer takes over (measured 3036 ms).
          Either accept that, or listen for webglcontextlost on the canvas directly and pre-empt
          the addon. Two traps from the same section: the addon only notices a lost context when it
          next tries to draw, so an idle pane keeps reporting `webgl` after its context is gone;
          and a pane holds three canvases, so anything reaching for the GL context must scan rather
          than take the first. app/spike/xterm/terminal-pane.ts is the working shape to start from.
      - id: P5a-T3b
        title: Renderer decision — a WebGL addon that actually paints on xterm 6, or drop the context budget
        status: todo
        depends_on: [P5a-T3]
        notes: >-
          RESEARCH.md G.4. addon-webgl 0.19.0 on xterm 6.0.0 activates, creates canvases, reports
          renderer 'webgl' and paints nothing; neither package declares a peer range so npm never
          warned. The deck ships on the DOM renderer, which works and puts real text in the DOM.
          Decide here: find a matching addon version and re-measure P0-T6's budget against it, or
          accept the DOM renderer and delete the per-pane context rationing that only existed to
          make WebGL affordable. Do not re-enable WebGL without a test that asserts painted text.
      - id: P5a-T4
        title: Previews — claude logs when the daemon is up, transcript tail otherwise
        status: todo
        notes: >-
          Owns the `claude logs` fixture (DECISIONS.md D28). fixtures/raw/logs-blocked.txt is
          captured but git-ignored and unscrubbed: it is a 4723-line terminal frame, not JSON, and
          scripts/capture-fixtures.mjs names it in DEFERRED against this task id. Scrubbing it
          needs a non-JSON path, and that path should be designed against this task's parser rather
          than guessed — RESEARCH.md F.2.5 measured 330 046 bytes from one short session, so what
          matters in the frame is a question only a consumer can answer.
      - id: P5a-T5
        title: Layouts 1/2/4/6/9 + focus, saved per project, keyboard rearrange
        status: todo
      - id: P5a-T6
        title: Per-pane controls — interrupt, stop, respawn, resume, rename, mute; "held elsewhere" state
        status: todo
        notes: >-
          Two defects found in P5a-T3 belong here (RESEARCH.md G.5). (1) The first keystroke after a
          pane opens is lost: focus() runs while the socket is still handshaking, so PaneSocket.send
          drops the frame — buffer input until `ready` instead of discarding it. (2) ConPTY's
          `ESC[?9001h` win32-input-mode sequence paints as `$$$$…5555` on the first row because
          xterm does not recognise it; filter it or find an xterm that does.
      - id: P5a-T7
