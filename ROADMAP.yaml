      - id: P2-T5
        title: Keyboard — Ctrl+K palette skeleton, j/k/Enter/Esc, ? shortcut sheet listing browser-owned keys
        status: done
        done_on: 2026-09-14
        notes: >-
          DECISIONS.md D34. The keymap was never the hard part — the deck is a page with xterm panes
          and a launch textarea on it, and every key SPEC §5.4 asks for except Ctrl+K is a character
          somebody is otherwise in the middle of typing. So bindings carry a `contexts` column and
          resolve against a KeyContext (deck / text / terminal / palette) derived from four facts
          about the focused element; `contracts/keymap.ts` decides, `app/deck/deck-keyboard.ts` reads
          the browser, neither knows the other. Esc is never taken from a pane; Ctrl+K is the one key
          that is, and the sheet says so. The listener captures on window because xterm handles keys
          on its own hidden textarea and bubbling would be too late. j/k move real DOM focus onto the
          row's toggle button rather than a selection index, which is why Enter is deliberately
          unbound on the deck — binding it would mean preventDefault-ing it, breaking every other
          control that can hold focus. The ? sheet LISTS the browser-owned keys from RESEARCH.md E.2
          rather than re-deriving them, and remaps nothing: SPEC §5.3's keyboard helper writes under
          ~/.claude* and is a different task. The palette carries only commands that exist — switch
          project (P3), Ask (P4) and change layout are absent, and connect stays a CLI because its
          dry-run/diff/--apply gate is the point (P1-T11). Verified in the running app, not only in
          tests (§G): 30 checks driven through Playwright against a real core — j/k/Enter/arrows over
          13 rows, / filtering, ? sheet, Ctrl+K from inside a live shell pane, `jjkk//??` reaching
          the terminal intact, and the launch prompt keeping every character typed into it.
      - id: P2-T6
        title: flightdeck.cmd — start core if absent, Next dev, Edge --app window; fail loudly if ports are taken
        status: done
        done_on: 2026-09-11
        notes: >-
          Production build, not `next dev` — the dev server renders the deck and never hydrates
          (RESEARCH.md G.3, P2-T6b). Building it turned up SEC-NET-1's other half: `next start` and
          `next dev` default to 0.0.0.0, so the DECK had been on the LAN since P0-T6 while core was
          correctly bound (G.6). Both now pass -H 127.0.0.1, and the runner verifies the loopback
          address rather than the port so a regression fails the start instead of exposing it.
      - id: P2-T6b
        title: Make `next dev` hydrate — the deck is production-build-only until it does
        status: done
        done_on: 2026-09-16
        depends_on: [P2-T6]
        deliverables:
          [
            tests/e2e/smoke/dev-checks.mjs,
            tests/e2e/smoke.mjs,
            .github/workflows/ci.yml,
            RESEARCH.md G.23,
          ]
        notes: >-
          RESEARCH.md G.23. It hydrates — measured from a cold .next and from a directory left by a
          production build: the HMR socket opens, `[HMR] connected`, the deck's own GET /api/stream
          is issued, seven rows render and React has attached. No page error, no CSP refusal.
          **Nothing in this repository fixed it**, and that is recorded rather than glossed: the
          proxy body, the proxy matcher and the CSP's dev relaxations are byte-identical to when
          G.3 was written, and `next` was pinned at 16.3.4 throughout. The remaining symptom was
          environmental, was never diagnosed, and now cannot be — inventing a cause would be worse
          than saying so. Which makes the GUARD the deliverable: a fix nobody can explain is one
          nobody can trust not to return, and this failure is silent by construction. So
          `npm run smoke:dev` runs the whole P2-T7 suite against `next dev` on every PR — 79
          checks, where "it hydrates" is not a special assertion but those groups passing at all.
          Two things that mode must do which the production run cannot: prove it really was the dev
          server (it asserts the two relaxations the dev policy carries and the production policy is
          tested never to have, plus that the HMR UPGRADE became a socket — G.3's exact symptom as a
          measurement), and expect StrictMode's double mount, which mints a second pane ticket that
          is never spent. README, CLAUDE.md, flightdeck.cmd and the run and ship skills all said the
          dev server never hydrates; all four are corrected.
      - id: P2-T7
        title: Playwright smoke against a fixture SSE stream
        status: done
        done_on: 2026-09-16
        deliverables:
          [
            tests/e2e/smoke.mjs,
            tests/e2e/fixture-core.mjs,
            tests/e2e/fixtures/deck.json,
            tests/e2e/smoke/deck-checks.mjs,
            tests/e2e/smoke/keyboard-checks.mjs,
            tests/e2e/smoke/pane-checks.mjs,
            tests/e2e/smoke/security-checks.mjs,
            .github/workflows/ci.yml,
            DECISIONS.md D35,
            RESEARCH.md G.22,
          ]
        notes: >-
          DECISIONS.md D35. The hard question was never what to assert — PR #20 had already written
          the list — it was what CI starts. `flightdeck.cmd` starts a real core, a real Claude
          session and an Edge window, and a runner has none of those; `next dev` renders and never
          hydrates (G.3), so the dev server was not an option either. Decided: the real PRODUCTION
          build served by real `next start`, against a fixture core that speaks core's HTTP surface
          and core's PTY protocol and owns no PTY. Every layer that has ever broken here — the
          proxy's per-request nonce, the rewrite's bearer, the stream route's no-transform — is the
          real one; only the far end of the wire is fixture. `page.route()` interception was
          rejected because it fakes on the far side of exactly those layers and cannot stream SSE
          at all, and a fixture mode inside core was rejected because it would put a test-only
          branch in the process that owns the PTYs. 87 checks: hydration, the seven rows and their
          order, both quota gauges off the replayed frame, expand/collapse, `/`, upsert and gone
          deltas, the unreadable banner, launch, j/k/Enter/?/Ctrl+K, `jjkk//??` reaching an echo
          shell intact through a real ticket and a real WebSocket, and the token appearing in none
          of the 42 responses the page was served. The fixture is hand-written — a DeckSnapshot is
          Flightdeck's own wire format, so there is nothing to capture and nothing to scrub — and
          the fixture core refuses to boot on one the real parsers would thin (G.22). **The job is
          advisory until it is added to main's ruleset**, which has an empty bypass list (D25) and
          today requires four checks that do not include it.

