            core/http/session-stream-route.ts,
            core/feeds.ts,
            scripts/core-status.ts,
            app/deck/deck-header.tsx,
            app/deck/quota-view-model.ts,
            app/deck/deck-store.ts,
            app/deck/deck-view.tsx,
            app/globals.css,
            tests/contracts/quota-summary.test.ts,
            tests/contracts/stream-event.test.ts,
            tests/core/application/quota-report.test.ts,
            tests/core/application/vitals-lines.test.ts,
            tests/core/http/session-stream-route.test.ts,
            tests/app/quota-view-model.test.ts,
