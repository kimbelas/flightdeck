          something happened to a session; a render says a status line was painted. A sweep per
          repaint would be `agents --json` twice a second for news already in the payload.
          **F.3.5's trap is held in the contract**: before the first turn the numbers are present
          and NULL, so null and absent both become `undefined` and neither becomes `0`. The payload
          is PROJECTED rather than mirrored — `prompt_cache` alone carries fourteen fields nobody
          reads — and `resets_at` is converted from seconds to milliseconds once, at the boundary.
          `IngestQueue` was extracted from `HookQueue` because a second caller appeared: the parts
          worth not copying are the subtle ones — drop the newest, one timer per batch, and a drain
