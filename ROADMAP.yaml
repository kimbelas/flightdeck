          RESEARCH.md G.29 is the entry, and the finding is about G.5 rather than about xterm. G.5
          recorded the garbage line above every pane and named `ESC[?9001h` as the cause. The
          sequence is real — it is the literal first 16 characters core sends, read off a live
          socket — and xterm 6 parses it perfectly, printing nothing, measured against all four
          private modes in the first frames. The line is `.xterm-char-measure-element`, the span
          xterm fills with 32 glyphs to size a cell, painting in the flow because the deck never
          imported `@xterm/xterm/css/xterm.css`. Only the P0-T6 spike ever did, and when
