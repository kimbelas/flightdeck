          than folded into `launch_failed`, because a run that exited 0 may well have started a
          session and "it failed" is how the owner ends up with two. `no_claude` became `no_shell`
          in the same move, so the sentence stops naming the wrong binary.
          **`rm` is the other half, and it owed a confirm.** F.8.4 measured it: `rm` takes the
          SHORT id and answers `No job matching '<uuid>'` for the full one — the same way round as
          `stop` and the OPPOSITE of `--resume`, which forks silently on a short id, so the three
          verbs still share no id helper. The button is three deliberate acts from a collapsed row
          — expand, `delete…`, then a button labelled `delete <name>` — it is NOT in `.row-actions`
          where `stop` lives, it is the one verb deliberately absent from the palette, and the
          armed warning says something different about a live session than about a stopped one. Its
          own route and its own failure union, so no body field and no shared code can point the
          stop button at it.
