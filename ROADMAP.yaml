          exists (F.8.1). It costs ~135 ms on a 2.7 s launch.
          **F.8.2 is the measurement SEC-PROC-1 was written on and nobody had taken.**
          `$env:FD_PROMPT` in PowerShell's argument mode is a VALUE — a prompt with spaces,
          quotes, `$`, `;` and `|` arrives as one argv element, and one that reads like flags
          arrives as one element too. The same script with the prompt interpolated splits it into
          thirteen AND executes a `$(Get-Date)` that happens to be in it, in the owner's shell.
          That is not a style difference; it is whether a prompt can run a command, and
          `tests/win/powershell-launch.test.ts` fails all four cases when the mechanism is removed.
