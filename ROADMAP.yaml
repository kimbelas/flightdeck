          RESEARCH.md F.5.2-F.5.3. The binding constraint is NOT the context count — measured at 40
          headless and 76 on the real GPU here, against a 9-pane layout — it is that
          @xterm/addon-webgl fires onContextLoss from a hard-coded setTimeout(..., 3000), so an
          evicted pane stays dead for ~3 s before the DOM renderer takes over (measured 3036 ms).
          Either accept that, or listen for webglcontextlost on the canvas directly and pre-empt
          the addon. Two traps from the same section: the addon only notices a lost context when it
          next tries to draw, so an idle pane keeps reporting `webgl` after its context is gone;
          and a pane holds three canvases, so anything reaching for the GL context must scan rather
          than take the first. app/spike/xterm/terminal-pane.ts is the working shape to start from.
      - id: P5a-T3b
        title: Renderer decision — a WebGL addon that actually paints on xterm 6, or drop the context budget
        status: done
        done_on: 2026-09-20
        depends_on: [P5a-T3]
        deliverables:
          [
            app/panes/terminal-pane.ts,
            app/deck/pane-view.tsx,
            app/page.tsx,
            package.json,
            DECISIONS.md D40,
            RESEARCH.md G.30,
