        notes: >-
          DECIDED: the DOM renderer, and the context budget is DELETED rather than re-measured —
          DECISIONS.md D40, measured in RESEARCH.md G.30.
          The premise this task was written on is wrong. G.4 said addon-webgl 0.19.0 paints nothing
          on xterm 6.0.0; measured in LIT PIXELS rather than in `report().renderer`, it paints
          14 532 px against the DOM renderer's 15 168. What it will not do is paint without
          `@xterm/xterm/css/xterm.css` — and then it paints 295 px, which is the cursor, which is
          word for word what G.4 described seeing. The deck had no such import until P5a-T6a, so
          **G.4 and G.5 were the same bug**, five weeks apart, filed against two different
          libraries. Every signal G.4 checked was a signal about what the library thought.
          So the choice was open, not forced, and it went to DOM on what the renderers do to the
          rest of the system rather than on speed. On DOM, `innerText` of `.pane-host` is what the
          smoke asserts, what a screen reader announces and what a person sees — one string, three
          readers. WebGL empties `.xterm-rows` and those come apart. Throughput is not the deciding
          number: nine panes and 4.5 MB is 478-536 ms on DOM and 341-469 ms on WebGL with a GPU,
          and SLOWER than DOM without one.
