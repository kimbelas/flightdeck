          rows a reviewer looks for. The panel reads on open and changes nothing until a button is
          pressed, which is also why `update` is not run on open: opening a panel must not be able
          to replace the binary.
          Three sabotages, each watched to fail (G.43): reading every `Key:` line instead of the
          allowlist breaks four tests including the account-name one, taking the respawn count from
          the request breaks four more, and a panel that says "all sessions restarted" breaks the
