      - id: P1-T6
        title: statusLine receiver — POST /statusline, vitals registry, token dropped on stop
        status: done
        done_on: 2026-09-12
        depends_on: [P0-T5]
        notes: >-
          RESEARCH.md F.3. Measured on a running core: **2.2–3.9 ms** per ack, and seven posts of
          the two real captures produced **three** events — which is the whole design.
          **A render is not news.** The block posts on every repaint, so `VitalsRegistry` holds the
          last report and the queue publishes only when context, cost, model, name or either quota
          percentage moved — the reconciler's `sameRow` idea, for the same reason. Without it the
          log and, from P1-T8, the store would fill with hundreds of identical lines a minute per
          session.
          **It does not nudge the reconciler**, and that is the difference from a hook. A hook says
          something happened to a session; a render says a status line was painted. A sweep per
          repaint would be `agents --json` twice a second for news already in the payload.
          **F.3.5's trap is held in the contract**: before the first turn the numbers are present
          and NULL, so null and absent both become `undefined` and neither becomes `0`. The payload
          is PROJECTED rather than mirrored — `prompt_cache` alone carries fourteen fields nobody
          reads — and `resets_at` is converted from seconds to milliseconds once, at the boundary.
          `IngestQueue` was extracted from `HookQueue` because a second caller appeared: the parts
          worth not copying are the subtle ones — drop the newest, one timer per batch, and a drain
          that cannot throw from a timer callback (G.10).
