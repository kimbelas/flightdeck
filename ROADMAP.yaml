# Flightdeck roadmap — the one place we track what is done.
#
# Update `status` (and `done_on`) as work lands.
#   npm run roadmap         prints progress and what is next
#   npm run roadmap:check   validates this file (also runs in CI)
#
# status: todo | doing | done | blocked | dropped
# Task ids go in commit messages:   feat(core): reconciler skeleton [P1-T4]

version: 1
project: flightdeck
updated: 2026-09-11

docs:
  spec: SPEC.md
  research: RESEARCH.md
  decisions: DECISIONS.md
  build_plan: BUILD-PLAN.md
  standards: CODING-STANDARDS.md
  security: SECURITY.md

rules:
  - A phase starts only when the previous phase's gate sentence is true.
  - A task is done when its tests pass in CI and the PR checklist is ticked.
  - Every task id appears in at least one commit message.
  - Anything security-relevant links the SECURITY.md control it satisfies.

# DP1 and DP2 were answered on 2026-09-10 (DECISIONS.md D20, D21) and are gone from this list.
decisions_pending:
  - id: DP3
    question: >-
      Tauri shell — worth building for a tray badge and a global hotkey alone? The Ctrl+W argument
      that scheduled it in D1 does not apply; the owner does not use Ctrl+W to delete words.
    deferred_to: P5a
    why_deferred: Five minutes of typing into a real pane answers it; deciding now is guessing.
    blocks: [P5b-T1]
    ref: DECISIONS.md D22

milestones:
  - id: M1
    name: The deck answers "what needs me?" without a terminal
    after: P2
  - id: M2
    name: Sessions start from the deck, named, on the subscription with more headroom
    after: P4
  - id: M3
    name: A full working day with no hand-opened terminal
    after: P6

phases:
  - id: P0
    name: Spikes and scaffold
    status: done
    goal: Remove the technical unknowns before any product code exists.
    gate: >-
      Every shape a P1 task parses is captured as a scrubbed fixture, and the http-hook
      receiver-down behaviour is documented. A shape first parsed in a later phase is captured by
      the task that parses it, and carries a named deferral in capture-fixtures.mjs until then
      (DECISIONS.md D28).
    tasks:
      - id: P0-T0
        title: Repo scaffold — git, tooling, CI, coding standards, security policy, roadmap
        status: done
        done_on: 2026-09-10
        notes: package.json, tsconfig (erasableSyntaxOnly), eslint flat config, prettier, vitest, .github workflows, this file.
      - id: P0-T1
        title: node-pty prebuild + ConPTY round trip on Node 26 and 20
        status: done
        done_on: 2026-09-10
        notes: RESEARCH.md A.1 — N-API prebuilds, no compiler, resize confirmed.
      - id: P0-T2
        title: TypeScript executed directly by Node 26 (type stripping, erasable syntax only)
        status: done
        done_on: 2026-09-10
        notes: scripts/roadmap-cli.ts runs with plain `node`; tsconfig enforces erasableSyntaxOnly.
      - id: P0-T3
        title: http hook behaviour — install SessionStart + Stop http hooks in one subscription, capture payloads, then observe the UX with the receiver down
        status: done
        done_on: 2026-09-10
        notes: >-
          RESEARCH.md F.1. Headline finding — http handlers are NEVER invoked for SessionStart
          (a command handler on the same entry fires); Stop over http works. Receiver down is
          silent in headless -p and shows a persistent non-blocking "Stop hook error occurred"
          banner in interactive/--bg sessions, which is the measured evidence for D21. Ack 0.54–1.31 ms
          steady state but 5.4–8.2 ms on the first request. Hooks installed in .claude-isg only and
          removed again; .claude-365 untouched.
        deliverables: [fixtures/hooks/*.json, RESEARCH.md F.1, scripts/hook-spike.ts, scripts/capture-fixtures.mjs]
        security: [SEC-ING-1, SEC-ING-2]
      - id: P0-T4
        title: --bg end to end — running background session shape in agents --json, logs, attach inside node-pty, second-attach error, stop, resume, rm; time the idle retirement once
        status: done
        done_on: 2026-09-10
        notes: >-
          RESEARCH.md F.2. Spike sessions fd-spike-idle, -a, -b, -c, -d removed on completion;
          TICKET-1898, orchestrator, docs-tool-f7 and a41e908d were never touched (SEC-PROC-5).
          Headline findings —
          (1) a LIVE background record has nine keys including pid AND status, so B.2 described the
          retired shape, not the background shape; presence of pid is the liveness test.
          (2) waitingFor never appears; the attention signal is state === 'blocked'.
          (3) attach is LAST-one-wins — the documented "Can't open" refusal never fires, the earlier
          attach is evicted with exit 0, so exclusivity is entirely ours (SEC-WS-3).
          (4) --resume forks a copy unless it is `--resume <full-uuid>` with no other argument.
          (5) rm removes a live session with no confirmation.
          (6) daemon/roster.json holds rvAuth/ptyAuth and prompt text — see P1-T14.
          (7) idle retirement fires at 60 min since last ACTIVITY, but the log line prints the
          session's AGE — the two coincide only for a session nobody touched, and the reason word
          (settled / idle-prompt / empty-idle) is the state it retired in. Low memory cuts it
          to ~32 min, so nothing may assume a session survives an hour.
        deliverables:
          [
            fixtures/agents/live-mixed.json,
            fixtures/agents/retired.json,
            fixtures/jobs/state.json,
            fixtures/jobs/state-blocked.json,
            fixtures/jobs/timeline.json,
            RESEARCH.md F.2,
            scripts/bg-spike.ts,
            scripts/bg-spike-cli.ts,
            tests/fixtures/agents.test.ts,
          ]
        security: [SEC-PROC-5, SEC-FS-1, SEC-FS-2]
      - id: P0-T5
        title: statusline.py POST — token read, 150 ms timeout, byte-identical render, refused connection under 5 ms
        status: done
        done_on: 2026-09-10
        notes: >-
          RESEARCH.md F.3. Byte-identical render proven in all four core states (disconnected,
          connected, refused, hung). Headline findings — (1) the transport is chosen by PYTHON
          IMPORT COST, not network cost: the status line is a fresh interpreter on every render,
          and urllib.request/http.client cost ~70 ms to import against socket's 11 ms, so the
          block hand-builds the request over a raw socket. (2) "refused connection under 5 ms" in
          this title is NOT achievable and was measured wrong at design time — a closed loopback
          port is not refused to Python on this machine, it is dropped (Node gets ECONNREFUSED in
          1.4 ms on the same port at the same moment). Mitigated by splitting the budget into a
          25 ms connect timeout and a 150 ms read timeout, which takes a dead core from 161 ms per
          render to 51 ms; SEC-ING-3 reworded to match. (3) Per render: 0.10 ms disconnected,
          21–26 ms connected, 51 ms core-down, 172–183 ms core-hung; receiver ack 0.29 ms median.
          (4) A real statusLine payload is captured for the first time (fixtures/statusline/) —
          before the first turn the context and usage numbers are present and NULL, not absent
          and not zero, and prompt_cache carries far more than RESEARCH.md D.3 lists.
        deliverables:
          [
            scripts/statusline-block.py,
            scripts/statusline-patch.ts,
            scripts/statusline-spike.ts,
            scripts/statusline-cost.py,
            scripts/statusline-spike-cli.ts,
            fixtures/statusline/fresh.json,
            fixtures/statusline/warm.json,
            RESEARCH.md F.3,
            tests/scripts/statusline-patch.test.ts,
            tests/fixtures/statusline.test.ts,
          ]
        security: [SEC-ING-3]
      - id: P0-T6
        title: xterm.js 6 in Next — WebGL, fit, resize, alt-screen, custom key handler, measure the WebGL context cap and onContextLoss fallback
        status: done
        done_on: 2026-09-11
        notes: >-
          RESEARCH.md F.5. Headline findings — (1) a strict CSP and Next hydration are in direct
          conflict and the failure is SILENT: script-src 'self' with no nonce blocks Next's own
          inline scripts, the page renders as HTML and never hydrates, and the only evidence is a
          minified React #412. Fixed with a per-request nonce from middleware.ts plus
          'strict-dynamic' (the two are a package). A nonce cannot be stamped onto statically
          prerendered HTML, so any route under this CSP must render per request — and
          `export const dynamic` is ignored on a 'use client' module, which is why the harness is
          split into a server page and a client component.
          (2) The WebGL context cap is NOT ~16 here: 40 headless (SwiftShader), 76 headed (real
          GPU). Eviction order is confirmed oldest-first in both, so the behaviour SPEC §5.3
          depends on holds while the number it cites does not. The 8-10 pane budget is safe by a
          wide margin; it just should not be justified by "~16 contexts".
          (3) The REAL constraint is latency: @xterm/addon-webgl 0.19.0 fires onContextLoss from
          its own setTimeout(..., 3000), measured at 3036 ms, so an evicted pane is dead for three
          seconds before the DOM renderer repaints it. The addon also only notices on its next
          draw, so renderer state is untrustworthy on idle panes.
          (4) next build rewrites the tsconfig it is pointed at, which was the root one core/ is
          checked by until typescript.tsconfigPath pinned it to tsconfig.app.json.
        deliverables:
          [
            app/layout.tsx,
            app/page.tsx,
            app/globals.css,
            app/spike/xterm/page.tsx,
            app/spike/xterm/xterm-harness.tsx,
            app/spike/xterm/terminal-pane.ts,
            app/spike/xterm/pane-grid.ts,
            app/spike/xterm/spike-api.ts,
            next.config.ts,
            middleware.ts,
            tsconfig.app.json,
            contracts/content-security-policy.ts,
            scripts/xterm-spike-cli.ts,
            tests/contracts/content-security-policy.test.ts,
            RESEARCH.md F.5,
          ]
        security: [SEC-UI-1, SEC-NET-2]
      - id: P0-T7
        title: Security probe — cross-origin fetch POST and WebSocket to :4950 rejected by Host, Origin, token and Content-Type checks
        status: done
        done_on: 2026-09-11
        notes: >-
          RESEARCH.md F.4. Every control fires and the probe names which one did it. Two clients,
          because only one of them can prove each half: Chromium for what a page cannot forge
          (Origin, Sec-Fetch-Site, the unanswered preflight, the WS handshake), a raw Node client
          for what forging faithfully models (Host, token, body limit). Headline findings —
          (1) the DECK'S OWN ORIGIN is blocked from calling core directly: a port is part of an
          origin, so :4949 to :4950 is cross-origin, and only the same-origin rewrite returned
          200. The Next rewrite is load-bearing, not a convenience, and the token never has to
          enter the browser for HTTP.
          (2) A cross-origin text/plain POST is a CORS simple request, so it SKIPS the preflight
          and really does land on core — Content-Type (SEC-HTTP-4) is what refuses it, not Origin.
          A hostile tab can always deliver a POST; the browser only stops it reading the answer.
          (3) A WebSocket handshake is not CORS-protected. From the deck origin the upgrade is
          accepted, so the token in the first frame is the only thing between an injected script
          and a live PTY — which, with (1), is why the token stays server-side.
          (4) DNS rebinding is recorded as SIMULATED, not proven: a forged Host is the faithful
          shape but a re-resolving name is not available offline.
          (5) SEC-NET-1 holds, and the LAN address is dropped rather than refused, so doctor must
          read a timeout as "not listening" (same behaviour as F.3.3).
        deliverables:
          [
            scripts/loopback-guard.ts,
            scripts/security-probe.ts,
            scripts/page-origin.ts,
            scripts/security-probe-browser.ts,
            scripts/security-probe-client.ts,
            scripts/security-probe-cli.ts,
            tests/scripts/loopback-guard.test.ts,
            RESEARCH.md F.4,
          ]
        security: [SEC-NET-1, SEC-HTTP-1, SEC-HTTP-2, SEC-HTTP-3, SEC-HTTP-4, SEC-HTTP-5, SEC-WS-1]
      - id: P0-T8
        title: SSE through the Next rewrite streams unbuffered in dev and start; fallback decided if not
        status: done
        done_on: 2026-09-11
        notes: >-
          RESEARCH.md F.6, DECISIONS.md D27. R16 is retired: the rewrite does NOT inherently buffer
          SSE — both candidate transports streamed unbuffered in dev and in `next start`, median
          inter-event 202-203 ms against a 200 ms cadence, worst gap 214 ms over three runs.
          Headline findings —
          (1) what buffers SSE is GZIP, not the rewrite. Next compresses the proxied response and a
          compressor holds the stream to the end: 12 events arrive as one chunk at ~2.25 s, with a
          200 OK and nothing in any log. Exactly one server-side header prevents it,
          `Cache-Control: no-transform`; `Content-Encoding: identity` and `X-Accel-Buffering: no`
          are both ignored, and `Accept-Encoding: identity` works but is a request header a
          browser's EventSource cannot set. The control run stays in the harness permanently.
          (2) the sub-question decided it before latency did. Middleware-set request headers DO
          reach an external rewrite destination, but `middleware.ts` runs on the EDGE runtime where
          `node:fs` does not exist, and the token is a per-boot file. Next 16 deprecates
          `middleware` for `proxy` and PROXY ALWAYS RUNS ON NODE.JS — so the rename is what makes
          the token readable at all. middleware.ts is now proxy.ts.
          (3) SSE ships on a force-dynamic route handler at /api/stream, not because it is faster
          (it is, by ~8 ms to first byte in `next start`, which decides nothing) but because it
          keeps the anti-gzip mitigation inside the deck instead of depending on core to remember a
          header from another process. /api/core/* keeps every non-stream call and stays
          load-bearing (F.4.2).
          (4) core down: the route handler answers a deliberate 503, the rewrite gives Next's 500
          with an HTML error page — the same 500 the deck returns when the deck itself is broken.
          (5) the rewrite strips Origin but forwards Sec-Fetch-Site, so a browser stream reaches
          core looking like a hook POST plus an unforgeable `same-origin`. screenStream therefore
          keeps SEC-HTTP-2's absent-Origin escape.
          (6) a GET has no Content-Type backstop (F.4.3's role for SEC-HTTP-4), so Sec-Fetch-Site
          and the token carry the stream route alone — the concrete reason the token stays
          server-side rather than a stylistic one.
          Also fixed while in there: `next build` was writing AGENTS.md and CLAUDE.md into the repo
          root (agentRules: false), Turbopack was rooting the build at the home directory, and a
          runtime path in readFileSync was tracing the whole project into the server bundle.
        deliverables:
          [
            proxy.ts,
            app/api/stream/route.ts,
            contracts/core-token.ts,
            scripts/sse-producer.ts,
            scripts/sse-probe.ts,
            scripts/sse-spike.ts,
            scripts/sse-spike-browser.ts,
            scripts/sse-spike-cli.ts,
            next.config.ts,
            tests/scripts/sse-probe.test.ts,
            tests/contracts/core-token.test.ts,
            tests/scripts/loopback-guard.test.ts,
            RESEARCH.md F.6,
          ]
        security: [SEC-HTTP-1, SEC-HTTP-2, SEC-HTTP-3, SEC-HTTP-4, SEC-HTTP-5, SEC-NET-1, SEC-UI-1]

      - id: P0-T9
        title: Close the P0 gate — capture daemon/roster.json and stop the scrubber skipping what it cannot parse
        status: done
        done_on: 2026-09-11
        notes: >-
          RESEARCH.md F.7, DECISIONS.md D28. Found by checking the gate sentence rather than
          assuming it. The clause "the http-hook receiver-down behaviour is documented" was already
          true (F.1, D21); "every shape in P0 is captured as a scrubbed fixture" was not, for one
          root cause — scripts/capture-fixtures.mjs only walked *.json and said nothing about the
          rest, reporting "11 raw capture(s)" against twelve files while --check passed.
          Headline findings —
          (1) the scrubber now TRIAGES: a capture it cannot scrub must be on an explicit DEFERRED
          list naming the task that will handle it, and anything else non-JSON fails the run. A
          deferral is a written decision instead of an absence.
          (2) roster.workers is the first fixture whose object KEYS are data rather than field
          names — each key is the short session id and equals the first segment of that worker's
          sessionId. Scrubbing the values and leaving the keys produced a fixture asserting a
          relationship it no longer had, which is WORSE than an unscrubbed one: P1-T14 would have
          been built against a lie. Keys of a DATA_KEYED_OBJECTS parent now track their own
          scrubbed sessionId, tested on both sides.
          (3) the roster's interesting half only exists while a --bg session does; an interactive
          session never appears in it. The shape had to be provoked, so the capture script starts
          one throwaway worker and removes it. the owner's TICKET-1898 and isg-6b were listed before and
          after and are unchanged (SEC-PROC-5).
          (4) `--bg` and `-p` are mutually exclusive — the prompt is the POSITIONAL argument.
          SEC-PROC-2's flag allowlist permits a combination the CLI refuses; P4-T1 builds on this
          verb.
          (5) never derive an id for `rm` from prose. The first capture parsed the id out of stdout
          with "last whitespace token" as a fallback, and ran `claude rm session`. `rm` removes a
          live session with no confirmation (F.2.5). The id now comes from a roster diff — the one
          worker key that was not there before the spawn — and anything other than exactly one new
          worker fails closed without running a removal verb.
          (6) SEC-FS-1 forbade reading `supervisorPid`, the one field D24's rationale for keeping
          this file allowlisted depends on. Amended to name proto, supervisorPid and updatedAt.
          (7) fakePath left path segments of 12 characters or fewer verbatim, so the machine
          account name was in every committed fixture. Recorded here as accepted at the time
          because the repo is public under a known account; reversed on 2026-09-11, since that
          account name is not the Windows one and the same rule also published client project
          folders and a ticket id. fakePath now keeps only STRUCTURAL_SEGMENTS (D23, F.7.8).
          The two remaining captures move to the tasks that parse them (D28): `claude logs` output
          to P5a-T4, daemon.log lifecycle lines to P7-T4.
        deliverables:
          [
            contracts/daemon-roster.ts,
            scripts/roster-capture.ts,
            scripts/capture-fixtures.mjs,
            fixtures/daemon/roster.json,
            eslint.config.mjs,
            tests/contracts/daemon-roster.test.ts,
            tests/capture-fixtures.test.ts,
            RESEARCH.md F.7,
          ]
        security: [SEC-FS-1, SEC-FS-2, SEC-DATA-2, SEC-PROC-1, SEC-PROC-2, SEC-PROC-5]

  - id: P1
    name: flightdeck-core (headless service)
    status: doing
    goal: A service that knows every live session across both subscriptions, with vitals and quota, within a second of any change.
    gate: With both subscriptions connected, `flightdeck-core status` prints every live session with subscription, name, state, flags, model, context %, cost and 5h/7d quota, and a Stop in any session appears within one second.
    depends_on: [P0]
    tasks:
      - id: P1-T1
        title: Domain model — Session entity, value objects, state machine and derived flags, table-tested
        status: done
        done_on: 2026-09-11
        notes: >-
          DECISIONS.md D7 as corrected by D29. The first product code in the repo, and the first
          task with no measurement to settle a dispute — so what it mostly did was reconcile D7
          against what P0 observed. Three of D7's names do not survive contact with the listing:
          waitingFor never appears on any record, `stopped` is never observed (`claude stop` leaves
          `state: done`), and `retired` cannot be derived from the listing at all. So `done` means
          "not running" and nothing more, and WHY a session ended is a separate axis — EndReason,
          defaulting to `unknown`, which is the honest answer for most of P1.
          Liveness is the presence of `pid`, never the run state (F.2.1), which is what keeps
          `wedged` off every finished row ten minutes after it ends.
          Shape: contracts/session.ts holds the unions with the reasons beside them; core/domain
          holds SessionId (short id and uuid are ONE value — the short id is the uuid's first
          segment, F.2.1), SessionVitals (null is not zero, F.3.5), SessionState (the transitions,
          returning Result rather than throwing) and Session (immutable; every transition returns a
          new instance, because the reconciler compares snapshots). core/shared has Result and
          FlightdeckError, which §6 specified and nothing had needed yet.
          88 of 88 lines in core/domain covered.
        deliverables:
          [
            contracts/session.ts,
            core/domain/session.ts,
            core/domain/session-id.ts,
            core/domain/session-state.ts,
            core/domain/session-vitals.ts,
            core/domain/session-flags.ts,
            core/shared/result.ts,
            core/shared/typed-error.ts,
            tests/contracts/session.test.ts,
            tests/core/domain/*.test.ts,
            tests/core/shared/result.test.ts,
          ]
      - id: P1-T2
        title: Ports and fakes — SessionSource, EventSink, ProcessRunner, Clock, Store, Notifier
        status: done
        done_on: 2026-09-11
        notes: >-
          Four of the six already existed — Clock, ProcessRunner and SessionSource arrived with
          P1-T1/T3, and PtyHost, PtyCommands, TokenFile and Logger with the P5a slice — so this
          task wrote the three nothing had needed yet (EventSink, Store, Notifier) and the fakes
          for the set. Ten ports, ten fakes.
          What the shapes commit to, each for a reason that would be expensive to reverse later:
          an event is a DraftEvent until the store gives it an id, because `since=` paging is
          only meaningful if the sequence has ONE author — a producer that numbered its own
          events could let a consumer miss one. `FdEvent.type` stays a `string` against R12: hook
          event names are Claude Code's to choose and it adds them between releases, so a union
          would make an unrecognised event a type error in the component whose job is to record
          it anyway (the same reason `Sweep.skipped` counts rather than throws). `source` IS
          closed — a new one is a new adapter.
          **Store is synchronous.** `node:sqlite` has no async API (R17), so a Promise-returning
          signature would be a lie every caller pays for: it would make the reconciler and the
          hooks queue async for a call that never yields. Sessions are NOT in the store — derived
          flags come from events and never from stored truth (BUILD-PLAN §3), and the live set is
          rebuilt from `agents --json` every sweep, so what survives a restart is what was
          observed rather than what was concluded. Events plus audit rows (SEC-PROC-3) is the
          whole interface; FTS5 widens it in P7, against a task that knows what it searches for.
          `EventSink.publish` returns `void` and never throws — P1-T5's budget is a `200 {}` in
          under 5 ms with the work queued behind it (F.1), and a sweep must not die because a
          browser disconnected. `Notifier` carries no mute: per-session mute is a deck preference
          (P6-T5), and a port that asked "should I?" as well as "do it" would be two jobs.
          Promoted, not rewritten — the P1-T10 lesson, applied on purpose: `StubSource` came out
          of deck-query.test.ts into FakeSessionSource and gained the case it lacked (a FAILED
          sweep, which is not `sessions: []`), and the `as unknown as NodeJS.WritableStream` cast
          that kept ConsoleLogger quiet in claude-cli-session-source.test.ts became FakeLogger —
          a cast §4 bans in core had been living in a test. FakeStore is a real implementation,
          not a stub: it keeps the id contract monotonic, gapless and separate per table, so a
          broken pager fails here rather than against sqlite. 25 new tests, 434 in the suite.
        deliverables:
          [
            contracts/fd-event.ts,
            contracts/audit-row.ts,
            core/ports/event-sink.ts,
            core/ports/store.ts,
            core/ports/notifier.ts,
            tests/fakes/fake-event-sink.ts,
            tests/fakes/fake-store.ts,
            tests/fakes/fake-notifier.ts,
            tests/fakes/fake-session-source.ts,
            tests/fakes/fake-logger.ts,
            tests/fakes/*.test.ts,
          ]
      - id: P1-T3
        title: ClaudeCliAdapter — `agents --json` per config dir with timeout, JSON parsing, fixture tests for interactive/background/done shapes
        status: done
        done_on: 2026-09-11
        depends_on: [P0-T4]
        notes: >-
          RESEARCH.md F.2.1–F.2.3. Three record shapes, not two: pid and status are OPTIONAL on a
          background record and presence of pid is the liveness test. Sweep with --all or a stopped
          session reads as gone (F.2.2). Nothing may key off waitingFor — it is never present.
          state 'done' means "not running" and covers stopped, retired and finished alike, so the
          reason comes from our own audit row or daemon.log, never from the listing.
      - id: P1-T4
        title: Reconciler — 10 s sweep, fs.watch nudge, 2 s stat poll, gone-detection
        status: done
        done_on: 2026-09-11
        depends_on: [P1-T2, P1-T3]
        notes: >-
          Three feeds decide WHEN to look (D3); one decides what is true, and it is the sweep.
          `fs.watch` is a nudge that may fire in bursts, spuriously, or not at all — E.5's
          ReadDirectoryChangesW semantics are not a bug to work around but the contract the port
          writes down — so the watcher adapter pairs it with a 2 s stat poll of the same
          directories and both only ever make the next sweep early.
          **The task turned up a bug in P1-T3 before it wrote a line of its own.** The source ran
          `agents --json` WITHOUT `--all`, and F.2.2 had already measured that the plain listing
          omits stopped and retired sessions entirely — so the first reconciler to run would have
          announced `gone` for every `claude stop`. Fixed in the adapter, where fixtures/agents/
          retired.json was already captured from the `--all` invocation. Verified on this machine:
          of the ten sessions found, FIVE are not live and would have been invisible.
          Two more traps, each refused with a test. (1) A failed sweep runs NO gone-detection for
          that subscription — `claude.exe` unavailable for four seconds would otherwise report
          every session on it as ended. (2) `gone` takes TWO consecutive successful sweeps of the
          session's own subscription, because G.2 measured that a record carries `state: working`
          before it carries `pid`: one sweep is never evidence that a session ended, and nothing
