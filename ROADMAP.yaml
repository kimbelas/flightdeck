          the routing and a second field could contradict it. `model` and `effort` stay dropped —
          they are the function's business. `agent` comes back because it is not routing: the
          function chooses the account and the model, the agent chooses the system prompt and the
          tools, and the docs compose the two. `claude-isg-orch` pins `--agent orchestrator`, so
          on that function a preset agent is REFUSED at save time (a `pins_agent` refusal beside
          `bad_cwd`), the way `pinsSessionName` already keeps a second `-n` off the command line.

          **The allowlist is the roster, not a text box.** `LaunchPreset.agent` is `undefined` or
          a name `WorkflowMapReader` found under the project's `.claude/agents/*.md` (or a plugin's,
          T5) at SAVE time and again at LAUNCH time — a roster file deleted between the two makes
          the launch refuse rather than start an agent Claude Code will not find. Screened by
          shape (`[a-z0-9-]{1,64}`), because the name reaches an argv element, a JSON body, a
          database column and a log line.

          **The argv.** `PowerShellLaunchCommands` gets a second fixed line for each of the three
          functions that do not pin an agent — `claude-365 --bg --agent $env:FD_AGENT -n
          $env:FD_NAME $env:FD_PROMPT` — chosen when the preset carries one, with `FD_AGENT` read
          back in argument mode like the other two (SEC-PROC-1; RESEARCH.md F.8.2 measured why, so
          the fixture test grows a row rather than trusting it). The audit row carries the agent.
          The presets panel shows the roster as a select with `none` first; the four built-ins
          stay agent-less. `presets.agent` is a nullable column and a migration, like `preset_group`.
