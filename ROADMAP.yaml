          real ConPTY and `$$$$` against the fixture — G.5 saw the second and wrote it down.
          The lost first keystroke was diagnosed correctly by G.5 and is fixed as described:
          `sendInput` queues below `ready` instead of letting `send`'s SEC-WS-1 guard double as a
          bin, bounded at 64 KiB, flushed AFTER the resize so a TUI does not redraw under it.
          `close()` doubles as the "did I ask?" flag P5a-T1 left owed, so a session PTY that exits 0
