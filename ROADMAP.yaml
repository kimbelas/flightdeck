        notes: >-
          **The first measurement contradicted the task's own premise**, which is the lesson worth
          keeping (G.43). This task asks for a `claude update` button; the first line of
          `claude doctor` is `Auto-updates: enabled`, with `Last update attempt: success → 2.1.278
          (2026-09-19)` two days earlier (F.10.1). The binary keeps itself current and nobody has to
          press anything. The button ships anyway — "check now" is a real thing to want and there is
          **no check-only form** of the verb — but the panel states that auto-updates are on rather
          than letting a button imply a chore that does not exist.
          **Doctor's output is parsed, not printed, and that is SEC-DATA-2.** Its `Path:` line is
          the binary's location with the Windows account name in it, and two more lines name the
          employer's policy source. `contracts/install-health.ts` reads a closed list of keys and
          drops everything else, so a line a future version adds is excluded by default rather than
          published by default — the bargain `contracts/core-status.ts` already makes about
          `transcriptPath`.
          **`claude update`'s stdout is not only `claude update`'s.** It runs a session lifecycle
          and fires the `SessionEnd` hook, so with core stopped it prints an ECONNREFUSED against
          `127.0.0.1:4950` — Flightdeck's own port (F.10.2). That is P0-T3's receiver-down behaviour
          turning up somewhere nobody looked for it, and relaying the output would show the owner an
          error Flightdeck caused, about Flightdeck, reading as Claude being broken.
          **`--all` does not mean all.** Measured with two background sessions, one `blocked` and
          one `done`, `respawn --all` restarted the first and skipped the second — while respawning
