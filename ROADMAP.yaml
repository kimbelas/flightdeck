      - id: P3-T4
        title: Worktree discovery with the lib/tree.mjs rules (main vs linked, never touch 4200/4201)
        status: done
        done_on: 2026-09-20
        deliverables:
          [
            contracts/worktree.ts,
            contracts/windows-path.ts,
            contracts/workflow-map.ts,
            core/application/worktree-reader.ts,
            core/application/workflow-map-reader.ts,
