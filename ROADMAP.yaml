          a short id, or any extra flag including -n, silently forks a copy under a new id and loses
          the name. The prompt goes in after the wake, not on the resume command. rm deletes a live
          session with no confirmation (F.2.8), so it needs its own confirm step and an audit row. A launch into a folder
          the config dir has not trusted blocks on a modal that --dangerously-skip-permissions does
          not bypass and Ctrl+C does not dismiss (F.3.6), so "started but never produced a session
          id" is a distinct outcome the launcher reports, not a hang.
        security: [SEC-PROC-1, SEC-PROC-2, SEC-PROC-3]
