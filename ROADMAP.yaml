      - id: P8-T2
        title: Spike — the deck through `tailscale serve` from the phone; Host, Origin, the WebSocket upgrade and the keyboard, measured
        status: todo
        depends_on: [P8-T1]
        security: [SEC-NET-1, SEC-HTTP-1, SEC-HTTP-2, SEC-WS-1]
        notes: >-
          A spike in P0's sense: nothing ships, every finding lands in RESEARCH.md with a date (a
          new §H), and T3 is designed from what was measured rather than from what the Tailscale
          docs say. Blocked on DP4 — Tailscale installed on this machine and the phone, same
          tailnet — and the install is recorded as the answer to DP4 the way P1-T12 recorded DP2.

          **Five questions, each with a yes/no the next task depends on.** (1) With
          `tailscale serve --bg --https=443 http://127.0.0.1:4949`, what `Host` does the deck
          receive — `127.0.0.1:4949` or `<machine>.<tailnet>.ts.net`? Core's `LoopbackGuard`
          compares `CORE_HOSTS` exactly (and the deck's own SEC-HTTP-1 check, if it has one — find
          out; `proxy.ts` does not), so this decides whether T3 is one allowlist entry or a header
          rewrite at the proxy. (2) Does the proxy carry a WebSocket upgrade, and does a path mount
          on the same HTTPS host (`tailscale serve --set-path /pty http://127.0.0.1:4950/pty`)
          reach core with `Origin: https://<machine>.<tailnet>.ts.net` — the one Origin core would
          then allowlist? (3) Does the P0-T7 security probe (`scripts/security-probe-cli.ts`)
          still refuse everything it refused, run against the tailnet address — a rebinding name,
          a foreign origin, a no-ticket upgrade? SEC-NET-1 is re-proven by `netstat`: nothing new
          listens on any address but loopback and Tailscale's own. (4) On the phone: does the
          phone's browser deliver keys to xterm.js in a pane, does the soft keyboard cover the
          cursor, does the CSP nonce survive the proxy, does `/api/stream` (SSE) stay unbuffered
          through it the way it did through the Next rewrite (RESEARCH.md F.6.1)? (5) Latency: a
          keystroke round trip on the tailnet, measured, so T4 knows whether a pane on a phone is
          a terminal or a composer.

          **What the spike must not do:** widen a bind, add a host flag, install anything under
          `~/.claude*`, or leave the proxy running after the measurements — `tailscale serve
          reset`. Every command typed is recorded, so T3's PR body can cite the section.
      - id: P8-T3
        title: The tailnet origin — one extra host/origin pair from config, and the PTY socket reached through the page's own host
        status: todo
        depends_on: [P8-T2]
        security: [SEC-NET-3, SEC-HTTP-1, SEC-HTTP-2, SEC-WS-1, SEC-UI-1]
        notes: >-
          The shape P5b-T3 was going to have for the Tauri origin, now for the tailnet one. Two
          changes, both allowlists, never wildcards.

          **Origins and hosts.** `contracts/origins.ts` grows a remote pair — exact
          `scheme://host[:port]` and `host[:port]` — read from ONE place core owns
          (`%LOCALAPPDATA%\flightdeck\remote.json`, or an argument the logon task passes; decide
          from T2's Host finding), screened by shape at load, refused if it names an IP literal, a
          wildcard, or a loopback name. `LoopbackGuard` compares against the loopback pair plus this
          one, and the PAIRING is the allowlist: a request carrying the remote host with a loopback
          origin, or the reverse, is refused. Absent config means today's behaviour byte for byte.
          The deck takes the same value from the same file if T2 shows it screens Host at all. The
          Next rewrite is server-to-server on loopback and does not change.

          **The socket.** `CORE_WEBSOCKET` is a constant today; it becomes a function of the
          page's `location`. On `127.0.0.1:4949` it stays `ws://127.0.0.1:4950` — direct, SPEC
          §4.1, and the smoke suite keeps measuring that path. On any other host it is
          `wss://<location.host>/pty`, the path mount T2 measured, and NOTHING else about the
          handshake changes: the ticket is still minted by `POST /pty-ticket` through the rewrite,
          bound to one target, burnt on presentation (SEC-WS-1, D32). Core sees the tailnet
          Origin, finds it in the pair, and the per-boot token still never enters a browser.

          **The security probe grows the remote case rather than a second probe**: the same
          refusals asserted against the remote pair, plus the mismatched-pair refusal above. Then
          `npm run build && npm run smoke` AND `npm run smoke:dev`, because `proxy.ts` and the CSP
          are on the path (the ship skill's G.3 rule).
      - id: P8-T4
        title: The phone view — the attention list, one pane, and a composer that sends a line
        status: todo
        depends_on: [P8-T3]
        security: [SEC-UI-1, SEC-UI-2, SEC-WS-3]
        notes: >-
          The deck is a wall (SPEC §5.4, D15: twenty rows on 1080p). A phone is a glance and a
          reply. Same app, same routes, same store — a layout chosen by viewport width (the
          900 px breakpoint becomes the boundary, plus a `?view=phone` override for measuring at
          the desk and in the smoke suite), never a second app.

          **Three things on the phone and nothing else.** (1) The attention-sorted rows with the
          needs-you border, the two quota gauges as numbers, and the row's expanded detail — last
          prompt, away summary, "doing now". (2) ONE pane: the grid is 1-up on a phone whatever
          the saved layout, `focus` mode's single pane, `fit` against the visual viewport so the
          soft keyboard does not hide the cursor (T2 says how bad this is). (3) The **composer**: a
