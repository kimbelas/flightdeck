          receiver that must ack in under 5 ms is not the place to add one. `session_id` is checked
          against the uuid shape because it reaches a command line later (SEC-ING-1, F.2.7).
          **A hook is evidence, never truth.** It says something happened; the sweep says what is
          true (D3). So the queue publishes the event and then `nudge()`s the reconciler — which is
          what makes the P1 gate sentence reachable through the path that already exists rather than
          through a second one that would have to be kept in agreement with it.
          **Which subscription sent it is read off `transcript_path`, not claimed.** The same token
          authenticates both, so a field would be worth the sender's honesty; a path that has to
          fall under one of two known config dirs cannot be talked into a third. A payload matching
          neither is refused, not guessed at.
          **No hook payload reaches a browser.** `last_assistant_message` is model text (SEC-UI-2);
          it is parsed for the store (P1-T8), never logged — verified against the live log — and the
          stream still refuses every event that is not the reconciler's.
