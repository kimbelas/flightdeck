name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default (SECURITY.md SEC-SUP-3). Jobs that need more declare it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · types · format · roadmap · unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install (lockfile only)
        run: npm ci

      - name: Lint (ESLint, type-aware, OOP rules)
        run: npm run lint

      - name: Type-check (tsc strict + erasableSyntaxOnly)
        run: npm run typecheck

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Roadmap validation
        run: npm run roadmap:check

      - name: Unit tests with coverage
        run: npm test

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: Windows integration (ConPTY, paths, ACLs)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Windows-only tests
        run: npm run test:win

  build:
    name: Next.js build (once the UI exists)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Detect the Next.js app
        id: next
        run: |
          if ls next.config.* >/dev/null 2>&1; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - if: steps.next.outputs.present == 'true'
        run: npm ci

      - if: steps.next.outputs.present == 'true'
        name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - if: steps.next.outputs.present != 'true'
        run: echo "No next.config.* yet (Phase 2) — build skipped."

  security:
    name: Audit · signatures · secrets · dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans history

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: npm audit (fail on high or critical)
        run: npm audit --audit-level=high

      - name: Verify registry signatures and provenance
        run: npm audit signatures

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency review (PRs)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
