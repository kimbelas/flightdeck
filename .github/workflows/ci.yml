name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default (SECURITY.md SEC-SUP-3). Jobs that need more declare it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · types · format · roadmap · unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install (lockfile only)
        run: npm ci

      - name: Lint (ESLint, type-aware, OOP rules)
        run: npm run lint

      - name: Type-check (tsc strict + erasableSyntaxOnly)
        run: npm run typecheck

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Roadmap validation
        run: npm run roadmap:check

      - name: Unit tests with coverage
        run: npm test

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: Windows integration (ConPTY, paths, ACLs)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Windows-only tests
        run: npm run test:win

  build:
    name: Next.js production build
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # Not `next dev`: the dev server renders the deck and never hydrates (RESEARCH.md G.3,
      # P2-T6b), so the production build is the only one that proves anything. The telemetry
      # opt-out is SEC-NET-2 and is set on every route that builds — here, release.yml and
      # flightdeck.cmd.
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  smoke:
    name: Deck smoke (Playwright, fixture core)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # Keyed on the resolved Playwright version, not on the range in package.json: a bump must
      # miss the cache, because a browser build is pinned to the library that drives it.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # `--with-deps` runs either way: the apt libraries are the runner's, not the cache's, and a
      # cache hit only skips the ~50 MB download.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The production build, because `next dev` renders the deck and never hydrates (G.3) — which
      # is precisely what this job exists to catch, so running it against dev would be circular.
      - name: Build the deck
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      # No core, no Claude Code, no ConPTY: the fixture core is in-process and the token file goes
      # to a temp directory (tests/e2e/fixture-core.mjs, DECISIONS.md D35).
      - name: Smoke
        run: npm run smoke

      # The same suite against `next dev` — P2-T6b. G.3 was silent for five days (the deck rendered
      # and never hydrated) and nothing would have caught it coming back. It runs after the
      # production pass rather than instead of it: the dev policy carries 'unsafe-eval' and the HMR
      # origin, so only the production run can assert SEC-UI-1.
      - name: Smoke against next dev
        run: npm run smoke:dev

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-screenshots
          path: smoke*.png
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: Audit · signatures · secrets · dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans history

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: npm audit (fail on high or critical)
        run: npm audit --audit-level=high

      - name: Verify registry signatures and provenance
        run: npm audit signatures

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency review (PRs)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
